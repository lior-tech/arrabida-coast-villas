function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(code){
  var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},k,b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function tryCode(code,quiet){
  try{var html=await dec(code);try{sessionStorage.setItem("acv_code",code)}catch(e){}

  catch(e){if(!quiet){document.getElementById("err").hidden=false}return false}
}
document.getElementById("g").addEventListener("submit",function(e){e.preventDefault();tryCode(document.getElementById("code").value.trim(),false)});
